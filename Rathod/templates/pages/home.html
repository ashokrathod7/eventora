<div class="page" id="page-home" style="padding-top:70px">
<section style="position:relative;min-height:92vh;display:flex;align-items:center;overflow:hidden;padding:40px 24px">
<div class="hero-blob" style="width:500px;height:500px;background:var(--accent-glow);top:-100px;right:-100px;animation:float 12s ease-in-out infinite"></div>
<div class="hero-blob" style="width:400px;height:400px;background:rgba(255,107,53,.1);bottom:-80px;left:-80px;animation:float2 10s ease-in-out infinite"></div>
<div style="max-width:1200px;margin:0 auto;width:100%;position:relative;z-index:2">
<div style="max-width:700px">
<div id="cnt_hero_badge" style="display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:30px;background:var(--accent-subtle);border:1px solid var(--accent-glow);margin-bottom:24px;font-size:13px;color:var(--accent);font-weight:500;animation:fadeUp .6s ease .2s both"></div>
<h1 id="cnt_hero_title" style="font-family:'Space Grotesk';font-size:clamp(32px,6vw,68px);font-weight:800;line-height:1.1;margin-bottom:20px;animation:fadeUp .6s ease .35s both"></h1>
<p id="cnt_hero_subtext" style="font-size:clamp(15px,2vw,19px);color:var(--fg-muted);line-height:1.7;margin-bottom:36px;max-width:540px;animation:fadeUp .6s ease .5s both"></p>
<div style="display:flex;gap:14px;flex-wrap:wrap;animation:fadeUp .6s ease .65s both">
<button class="btn-primary" id="cnt_hero_btn1" onclick="navigate('events')" style="font-size:16px;padding:15px 32px"></button>
<button class="btn-secondary" id="cnt_hero_btn2" onclick="navigate('about')" style="font-size:16px;padding:15px 32px"></button>
</div>
<div style="animation:fadeUp .6s ease .8s both; width: 100%; margin-top: 40px;">
<div style="display:flex; gap:8px; align-items:center; margin-bottom:15px; font-size:12px; color:var(--success); font-weight:700; letter-spacing:1px;">
<span style="width:10px; height:10px; background:var(--success); border-radius:50%; display:inline-block; box-shadow: 0 0 8px var(--success); animation: wa-pulse 1.5s infinite;"></span>
              LIVE COUNT
            </div>
<div class="hero-stats" style="display:flex;gap:30px;flex-wrap:wrap;justify-content:flex-start">
<div><div id="cnt_hero_stat1_num" style="font-family:'Space Grotesk';font-size:32px;font-weight:800;color:var(--accent)">0+</div><div id="cnt_hero_stat1_lbl" style="font-size:13px;color:var(--fg-muted);margin-top:2px"></div></div>
<div><div id="cnt_hero_stat2_num" style="font-family:'Space Grotesk';font-size:32px;font-weight:800;color:var(--accent)">0+</div><div id="cnt_hero_stat2_lbl" style="font-size:13px;color:var(--fg-muted);margin-top:2px"></div></div>
<div><div id="cnt_hero_stat3_num" style="font-family:'Space Grotesk';font-size:32px;font-weight:800;color:var(--accent)">0+</div><div id="cnt_hero_stat3_lbl" style="font-size:13px;color:var(--fg-muted);margin-top:2px"></div></div>
</div>
</div>
</div>
</div>
</section>
<section style="max-width:1200px;margin:0 auto;padding:60px 24px 80px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;flex-wrap:wrap;gap:16px">
<div><h2 style="font-family:'Space Grotesk';font-size:clamp(24px,4vw,36px);font-weight:800">Featured Events</h2><p style="color:var(--fg-muted);margin-top:6px;font-size:15px">Don't miss out on these trending events</p></div>
<button class="btn-secondary btn-sm" onclick="navigate('events')">View All <i class="fas fa-arrow-right" style="font-size:12px"></i></button>
</div>
<div id="featuredGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px"></div>
</section>
