<div class="page" id="page-how-to-reg" style="padding-top:70px">
<section style="max-width:800px;margin:0 auto;padding:20px 24px 80px">
<h2 style="font-family:'Space Grotesk';font-size:32px;font-weight:800;margin-bottom:24px;color:var(--danger)">How To Registration</h2>
<div class="card" style="overflow:hidden;margin-bottom:24px">
<div id="reg_video_container" style="position:relative;width:100%;padding-bottom:56.25%;height:0;overflow:hidden;border-bottom:1px solid var(--border)"></div>
</div>
<div class="card" style="padding:28px">
<h3 style="font-weight:700;font-size:18px;margin-bottom:14px">Registration Details</h3>
<div style="margin-bottom: 16px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
<span style="font-size:11px; color:var(--fg-muted); font-weight:600; margin-right:4px;">Translate:</span>
<button class="lang-btn active" id="reg-lang-btn-en" onclick="translateRegDetails('en')">EN</button>
<button class="lang-btn" id="reg-lang-btn-hi" onclick="translateRegDetails('hi')">हिंदी</button>
<button class="lang-btn" id="reg-lang-btn-mr" onclick="translateRegDetails('mr')">मराठी</button>
</div>
<p id="reg_details_text" style="color:var(--fg-muted);line-height:1.8;font-size:15px;white-space:pre-wrap"></p>
</div>
</section>
</div>
