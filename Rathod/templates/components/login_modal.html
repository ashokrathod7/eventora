<div class="modal-overlay" id="loginModal">
<div class="modal-box">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px">
<h3 style="font-family:'Space Grotesk';font-weight:700;font-size:24px">Welcome Back</h3>
<button onclick="closeModal('loginModal')" style="background:none;border:none;color:var(--fg-muted);font-size:20px;cursor:pointer"><i class="fas fa-xmark"></i></button>
</div>
<div id="loginErrorBox" style="display:none;padding:11px 13px;border-radius:12px;background:rgba(220,38,38,.10);border:1px solid rgba(220,38,38,.35);color:#ef4444;font-size:13px;line-height:1.45;font-weight:600"></div>
<div style="display:flex;flex-direction:column;gap:16px">
<div><label style="font-size:13px;font-weight:600;color:var(--fg-muted);display:block;margin-bottom:6px">Email</label><input class="input-field" id="loginEmail" placeholder="you@example.com" type="email"/></div>
<div><label style="font-size:13px;font-weight:600;color:var(--fg-muted);display:block;margin-bottom:6px">Password</label><div style="position:relative"><input autocomplete="current-password" class="input-field" id="loginPass" placeholder="Enter password" style="padding-right:46px" type="password"/><button onclick="togglePasswordVisibility('loginPass',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--fg-muted);cursor:pointer" type="button"><i class="fas fa-eye"></i></button></div></div>
<div style="text-align:right"><span onclick="closeModal('loginModal');openModal('forgotModal')" style="font-size:13px;color:var(--accent);cursor:pointer">Forgot Password?</span></div>
<button class="btn-primary" onclick="handleLogin()" style="width:100%;justify-content:center"><i class="fas fa-sign-in-alt"></i> Login</button>
<p style="text-align:center;font-size:14px;color:var(--fg-muted)">Don't have an account? <span onclick="closeModal('loginModal');openModal('registerModal')" style="color:var(--accent);cursor:pointer;font-weight:600">Sign Up</span></p>
</div>
</div>
</div>
